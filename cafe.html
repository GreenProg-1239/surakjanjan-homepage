<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수락잔잔 | 카페안내</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><img src="assets/logo.png" alt="surakzanzan.com 로고" /></a>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="main-nav">
        <a href="/">홈</a>
        <a href="/rooms">예다움사랑채 펜션</a>
        <a href="/cafe" class="active">수락잔잔 카페</a>
        <a href="/facilities">부대시설 안내</a>
        <a href="/breakfast">바베큐&조식세트 안내</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="cafe-slider-wrap">
          <div class="gallery-main room-slider cafe-slider" data-cafe-slider>
            <button class="gallery-arrow prev" type="button" aria-label="이전 사진" data-cafe-prev>‹</button>
            <img src="assets/cafe/cafemain.jpg" alt="수락잔잔 카페 대표 이미지" data-cafe-main />
            <button class="gallery-arrow next" type="button" aria-label="다음 사진" data-cafe-next>›</button>
            <div class="gallery-counter" data-cafe-counter>1 / 3</div>
          </div>
    
          <div class="cafe-slider-text">
            <p class="eyebrow" data-cafe-eyebrow>surakzanjan cafe</p>
            <h1 data-cafe-title>수락잔잔 카페</h1>
            <p data-cafe-desc>
              펜션 내 카페 공간에서 핸드드립 커피와 달콤한 디저트
              풍경을 보며 쉬어갈 수 있는 조용한 휴식 공간
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">메뉴 안내</h2>
        <div class="menu-showcase">
          <div class="cafe-menu-images">
            <a href="assets/cafe/menu1.png" target="_blank">
              <img src="assets/cafe/menu1.png" alt="메뉴판 1페이지" loading="lazy">
            </a>
          
            <a href="assets/cafe/menu2.png" target="_blank">
              <img src="assets/cafe/menu2.png" alt="메뉴판 2페이지" loading="lazy">
            </a>
          
            <a href="assets/cafe/menu3.png" target="_blank">
              <img src="assets/cafe/menu3.png" alt="메뉴판 3페이지" loading="lazy">
            </a>
          
            <a href="assets/cafe/menu4.png" target="_blank">
              <img src="assets/cafe/menu4.png" alt="메뉴판 4페이지" loading="lazy">
            </a>
          
            <a href="assets/cafe/menu5.png" target="_blank">
              <img src="assets/cafe/menu5.png" alt="메뉴판 5페이지" loading="lazy">
            </a>
          </div>
          <div class="menu-note">※ 메뉴 및 가격은 계절과 운영 상황에 따라 변동될 수 있습니다.<br />※ 운영시간: 매일 9:00 ~ 20:00 </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 surakzanzan. All rights reserved.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
